<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetProtect — nouvelle adresse</title>
<meta name="description" content="Le site NetProtect a déménagé : retrouvez l'application, les captures, le téléchargement de la version 2.37 et la commande de licence sur la nouvelle adresse.">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lompojerome80-hue.github.io/netprotect-demo/">
<meta http-equiv="refresh" content="0; url=https://lompojerome80-hue.github.io/netprotect-demo/">
<script>
(function () {
  // Conserve les parametres de suivi (?fbclid=...) et les ancres (#tarifs).
  var cible = "https://lompojerome80-hue.github.io/netprotect-demo/"
    + (location.search || "")
    + (location.hash || "");
  location.replace(cible);
})();
</script>
<style>
  :root{ --navy:#0b1220; --navy2:#0f172a; --teal:#5eead4; --text:#e7eef7; --muted:#9fb0c3; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--navy); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.6;
  }
  .box{
    max-width:520px; width:100%; text-align:center;
    background:var(--navy2); border:1px solid rgba(94,234,212,.18);
    border-radius:18px; padding:40px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .brand{
    display:inline-flex; align-items:center; gap:10px;
    font-weight:800; letter-spacing:.3px; font-size:15px; color:var(--teal);
    margin-bottom:22px;
  }
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block}
  h1{font-size:22px;line-height:1.3;margin:0 0 12px}
  p{color:var(--muted);margin:0 0 22px;font-size:15px}
  a.btn{
    display:inline-block; text-decoration:none; font-weight:700; font-size:15px;
    background:var(--teal); color:#04211d; padding:14px 22px; border-radius:12px;
  }
  a.btn:hover{background:#8ff5e3}
  .url{margin-top:18px;font-size:13px;color:#6f8296;word-break:break-all}
</style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="dot"></span>NetProtect</div>
    <h1>Le site a déménagé</h1>
    <p>Vous allez être redirigé automatiquement vers la nouvelle adresse de NetProtect.</p>
    <a class="btn" href="https://lompojerome80-hue.github.io/netprotect-demo/">Aller sur netprotect-demo</a>
    <p class="url" id="url">https://lompojerome80-hue.github.io/netprotect-demo/</p>
  </main>
  <script>
  // Si la redirection automatique est bloquee, on affiche l'adresse reelle a cliquer.
  document.getElementById("url").textContent =
    "https://lompojerome80-hue.github.io/netprotect-demo/"
    + (location.search || "") + (location.hash || "");
  </script>
</body>
</html>
