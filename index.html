<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NetProtect — Site en développement</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #123a63 0%, #0b2a4a 55%, #081d33 100%);
    color: #eaf1f8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    color: #1a2b3c;
    border-radius: 18px;
    padding: 36px 28px 30px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    letter-spacing: .3px;
    color: #0b2a4a;
    font-size: 20px;
    margin-bottom: 18px;
  }
  .brand .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #f0a11b;
    box-shadow: 0 0 0 4px rgba(240, 161, 27, .18);
  }
  h1 {
    font-size: 24px;
    line-height: 1.25;
    margin: 6px 0 12px;
    color: #0b2a4a;
  }
  p { font-size: 15.5px; line-height: 1.6; color: #45566a; margin: 10px 0; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 22px;
    padding: 15px 20px;
    background: #25d366;
    color: #04331b;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 12px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 22px; height: 22px; fill: #04331b; }
  .num { margin-top: 12px; font-size: 14.5px; color: #6b7c90; letter-spacing: .3px; }
  .foot { margin-top: 22px; font-size: 12.5px; color: #93a3b5; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="dot"></span>NetProtect</div>
    <h1>Site en développement</h1>
    <p>Notre site est en cours de préparation et sera bientôt disponible.</p>
    <p>Pour toute information, commande ou assistance, contactez l'administrateur.</p>
    <a class="btn" href="https://wa.me/22606181574" rel="noopener" aria-label="Contacter sur WhatsApp">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.1.6 4.1 1.6 5.9L4 29l8.3-1.6c1.7.9 3.6 1.4 5.7 1.4 6.6 0 12-5.4 12-12S22.6 3 16 3zm0 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-4.9.9 1-4.8-.2-.4c-1-1.6-1.5-3.4-1.5-5.3C5.9 9.6 10.4 5 16 5s10.1 4.6 10.1 10-4.6 9.8-10.1 9.8zm5.6-7.4c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1c-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1s0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5s0-.4 0-.5-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.3 5.2 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/></svg>
      Contacter
    </a>
    <div class="num">+226 06 18 15 74</div>
    <div class="foot">Merci de votre compréhension.</div>
  </main>
</body>
</html>
